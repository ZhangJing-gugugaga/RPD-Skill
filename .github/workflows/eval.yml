name: Run Eval Tests
"on":
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -c "import sys; print(sys.version); print(sys.platform)"
    - run: python -c "from pathlib import Path; print(list(Path('rpd/scripts').glob('*.py')))"
    - run: python rpd/scripts/run-eval.py
