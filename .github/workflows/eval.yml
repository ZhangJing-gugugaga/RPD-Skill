name: Run Eval Tests
"on":
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Run eval with error capture
      run: |
        python rpd/scripts/run-eval.py 2>&1 || true
        echo "Exit code was: $?"
