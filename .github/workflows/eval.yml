name: Run Eval Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Debug environment
      run: |
        echo "Python version: $(python --version)"
        echo "Working directory: $(pwd)"
        echo "Platform: $(uname -a)"
        echo "Locale: $(locale)"
        echo "PYTHONIOENCODING: $PYTHONIOENCODING"
        echo "---"
        echo "Files in rpd/:"
        ls -la rpd/
        echo "---"
        echo "Files in rpd/scripts/:"
        ls -la rpd/scripts/

    - name: Test basic Python
      run: |
        python -c "import sys; print(f'Python {sys.version}'); print(f'Encoding: {sys.stdout.encoding}')"
        python -c "from pathlib import Path; print(f'Path test: {Path(\"rpd/scripts\").resolve()}')"

    - name: Run eval tests
      working-directory: rpd
      run: python scripts/run-eval.py
      env:
        PYTHONIOENCODING: utf-8
